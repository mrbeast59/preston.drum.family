################################################################################
#                                                                              #
# Optima Theme Configuration Settings                                          #
#                                                                              #
################################################################################

optima:
  # Optima date formats
  # Refer to https://shopify.github.io/liquid/filters/date/ if you want to
  # customize these.
  #
  time_and_date_short_format: "%-I:%M %P - %-d %b %Y"

  # Plausible analytics: https://plausible.io/
  #
  plausible_analytics: drum.family

  post_categories:

    articles:
      enabled: false

    journal:
      enabled: false

    notes:
      enabled: false

  # If you want to link only specific pages in your header, uncomment this and
  # add the path to the pages in order as they should show up.
  #
  header_pages:
    - pages/home.md
    - pages/drone.md
#     - journal
#     - notes
#     - articles
#     - pages/now.md
#     - pages/about.md
#     - pages/search.md

  # If you want to link only specific pages in your footer, uncomment this and
  # add the path to the pages in order as they should show up.
  #
  footer_pages:
    - pages/home.md
    - pages/drone.md
#     - journal
#     - notes
#     - articles
#     - pages/archives.md
#     - pages/now.md
#     - pages/about.md
#     - pages/search.md
#     - pages/analytics.md

